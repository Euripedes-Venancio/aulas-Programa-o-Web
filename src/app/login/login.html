<div id="container_formulario_login" class="text-center  container w-50 mx-auto">
    <h2>Login</h2>

<input type="email" [(ngModel)]="email" name="email" class="form-control my-3" placeholder="Digite seu E-mail">

<input type="password" [(ngModel)]="senha" name="senha" class="form-control my-3" placeholder="Digite sua senha">

<br>

<button (click)="Login()" class="btn btn-danger">Entrar</button>
</div>
