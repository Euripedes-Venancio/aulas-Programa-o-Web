<div class="container-fluid p-3 shadow-sm bg-white">

  <div class="row align-items-center g-3">

    <!-- LOGO -->
    <div class="col-12 col-md-3 text-center text-md-start">
      <a routerLink="">
        <img src="logotipo_pastelaria.png" alt="Logo" class="logo-img">
      </a>
    </div>

    <!-- BUSCA -->
    <div class="col-12 col-md-6">
      <div class="input-group">
        <input 
          type="text" 
          class="form-control" 
          placeholder="Buscar pastéis malucos..."
          [(ngModel)]="busca"
        >
        <button class="btn btn-danger" (click)="buscar()">Buscar</button>
      </div>
    </div>

    <!-- USUÁRIO -->
    <div class="col-12 col-md-3 d-flex justify-content-center justify-content-md-end align-items-center gap-2">

      <span class="usuario-msg">{{mensagem}}</span>

      <a routerLink="/login">
        <i class="bi bi-person-circle user-icon"></i>
      </a>

      <button (click)="logout()" class="btn btn-outline-danger btn-sm">
        Logout
      </button>

    </div>

  </div>

</div>

<!-- ALERTA -->
<div class="alerta-topo">
  <div class="texto-rolando">
    Não nos responsabilizamos por eventuais diarréias     •     Pastéis malucos passando na sua tela      •     Coma por sua conta e risco 😈
  </div>
</div>

<!-- MENU -->
<div class="menu-container">
  <nav class="menu">
    
    <a routerLink="/vitrine" routerLinkActive="ativo">Vitrine</a>
    <a routerLink="/cesta" routerLinkActive="ativo">Cesta</a>
    <a routerLink="/contato" routerLinkActive="ativo">Contato</a>

  </nav>
</div>

<router-outlet></router-outlet>

<footer class="rodape">
  © 2026 Pastelaria Iogi
</footer>
