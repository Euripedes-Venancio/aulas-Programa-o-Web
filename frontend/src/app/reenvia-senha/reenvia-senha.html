<div class="container senha-container">
  <div class="senha-card">
    <span class="badge bg-danger mb-3">Recuperação</span>
    <h2 class="titulo-senha">Reenviar senha</h2>
    <p class="texto-senha">
      Informe abaixo o e-mail utilizado no cadastro para recuperar sua senha.
    </p>

    <form>
      <label class="form-label">E-mail</label>
      <input
        type="email"
        [(ngModel)]="email"
        name="email"
        class="form-control mb-3"
        placeholder="Digite seu e-mail"
      >

      <button type="button" (click)="reenviar()" class="btn btn-danger w-100">
        Reenviar senha
      </button>
    </form>
  </div>
</div>
