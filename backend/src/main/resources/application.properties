# ========================
# Banco de Dados MySQL
# ========================
spring.datasource.url=jdbc:mysql://localhost:3306/pastelaria?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ========================
# Email SMTP
# Preencha com uma senha de app se for usar Gmail.
# Não suba senhas reais para o GitHub.
# ========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ========================
# Servidor
# ========================
server.port=8080
