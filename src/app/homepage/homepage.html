<div class="container homepage-container">

  <div class="text-center mb-4">
    <h1 class="titulo-home">Pastelaria Iogi</h1>
    <p class="subtitulo-home">
      Uma experiência única para quem gosta de criatividade, humor e recheios fora da curva.
    </p>
  </div>

  <div class="carousel-wrapper">
    <div
      id="informacoes-pastelaria"
      class="carousel slide"
      data-bs-ride="carousel"
      data-bs-interval="2000"
    >

      <div class="carousel-indicators">
        <button type="button" data-bs-target="#informacoes-pastelaria" data-bs-slide-to="0" class="active"></button>
        <button type="button" data-bs-target="#informacoes-pastelaria" data-bs-slide-to="1"></button>
        <button type="button" data-bs-target="#informacoes-pastelaria" data-bs-slide-to="2"></button>
      </div>

      <div class="carousel-inner rounded-3 overflow-hidden">

        <div class="carousel-item active">
          <img src="imagem-pasteleiro.png" class="img-carousel" alt="Funcionário experiente">
          <div class="legenda-carousel">
            <h5>Funcionário Experiente</h5>
            <p>Mais de 10 anos fazendo pastel</p>
          </div>
        </div>

        <div class="carousel-item">
          <img src="imagem-unidade-sbc.png" class="img-carousel" alt="Filial em São Bernardo">
          <div class="legenda-carousel">
            <h5>Nova filial em São Bernardo</h5>
            <p>Área ampla para você comer pastel e se divertir</p>
          </div>
        </div>

        <div class="carousel-item">
          <img src="imagem-comendo-pastel-goiaba.png" class="img-carousel" alt="Pastel de goiaba">
          <div class="legenda-carousel">
            <h5>Pastel de Goiaba</h5>
            <p>Um dos sabores mais diferentes da casa</p>
          </div>
        </div>

      </div>

      <button class="carousel-control-prev" type="button" data-bs-target="#informacoes-pastelaria" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>

      <button class="carousel-control-next" type="button" data-bs-target="#informacoes-pastelaria" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>

    </div>
  </div>

</div>
