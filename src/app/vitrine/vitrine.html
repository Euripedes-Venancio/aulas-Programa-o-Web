<h4>Vitrine</h4>

@for (obj of lista; track obj) {

  <div class="row align-items-center border p-3 mb-3">

    
    <div class="col-2">
      <img [src]="obj.imagem" class="img-produto">
    </div>

    
    <div class="col-10">

      
      <h4 class="fw-bold">{{obj.nome}}</h4>

    
      <p class="text-muted mb-2">{{obj.descritivo}}</p>

      
      <div class="d-flex justify-content-between align-items-center">

        <h5 class="mb-0">R$ {{obj.valor}}</h5>

        @if(obj.quantidade > 0){
          <button class="btn btn-danger">
            Adicionar na cesta
          </button>
        }
        @else {
          <span class="text-danger">Produto em falta</span>
        }

      </div>

    </div>

  </div>

}
