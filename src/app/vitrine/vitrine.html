<h4>Vitrine</h4>
<div>
@for (obj of lista; track obj) {
    <div class=" row border border-danger align-item-center">
        <h4 class="col-2">{{obj.nome}}</h4>
        <h4 class="col-2">{{obj.valor}}</h4>
        @if(obj.quantidade > 0){
        <button class=" col-2 btn btn-danger" >Adcionar na cesta</button>
        }
        @else {
           <p class="col text-danger"> Produto em falta</p>
        }

    </div>
}
</div>
