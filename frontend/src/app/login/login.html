<div class="container auth-container">
  <div class="row g-4 justify-content-center align-items-stretch">

    <div class="col-12 col-lg-5">
      <div class="auth-card">
        <span class="badge bg-danger mb-3">Área do cliente</span>
        <h2 class="titulo-auth">Login</h2>
        <p class="texto-auth">
          Entre com seu e-mail e senha para acessar sua conta.
        </p>

        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          class="form-control my-3"
          placeholder="Digite seu e-mail"
        >

        <input
          type="password"
          [(ngModel)]="senha"
          name="senha"
          class="form-control my-3"
          placeholder="Digite sua senha"
        >

        <a [routerLink]="['/reenviar']" class="link-auth">
          Esqueci minha senha
        </a>

        <button (click)="fazerLogin()" class="btn btn-danger w-100 mt-3">
          Entrar
        </button>
      </div>
    </div>

    <div class="col-12 col-lg-5">
      <div class="auth-card destaque-cadastro">
        <span class="badge bg-dark mb-3">Novo por aqui?</span>
        <h2 class="titulo-auth">Criar cadastro</h2>
        <p class="texto-auth">
          Cadastre-se para explorar nossos pastéis mais suspeitamente deliciosos.
        </p>

        <a routerLink="/cadastro" class="btn btn-outline-danger w-100 mt-3">
          Clique aqui para se cadastrar
        </a>
      </div>
    </div>

  </div>
</div>
